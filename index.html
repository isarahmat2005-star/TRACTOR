<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>TracTor by IRS</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1e1e1e; color: #fff; }
        #dropzone { border: 2px dashed #4CAF50; padding: 50px; text-align: center; cursor: pointer; margin-bottom: 20px; border-radius: 8px; }
        #dropzone:hover { background: #2a2a2a; }
        .preview-container { text-align: center; }
        #preview { max-width: 100%; height: 250px; border: 1px solid #555; background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAAXNSR0IArs4c6QAAACVJREFUKFNjZCASMDKgAnv37v3PBEWwyTBx0kwwMQaKqGBgAABd9wcxt9k2YAAAAABJRU5ErkJggg=='); }
        button { padding: 10px 20px; font-size: 16px; background: #4CAF50; color: #fff; border: none; cursor: pointer; border-radius: 4px; }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>TracTor by IRS - Batch Image to Vector</h2>
    <div id="dropzone">Drop Gambar ke Sini atau Klik untuk Upload</div>
    <input type="file" id="fileInput" multiple style="display:none;" accept="image/png, image/jpeg">
    
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <button id="btnProcess">Mulai Batch Trace</button>
        <span id="status" style="font-weight: bold; color: #4CAF50;">Menunggu file...</span>
    </div>
    
    <div class="preview-container" style="margin-top: 20px;">
        <h3>Preview Input:</h3>
        <canvas id="preview"></canvas>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
